<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Practice</title>
</head>
<body>
<form action="">
<legend><h1>Student Registeration Form</h1></legend>
<label for="name"><b>Student Name:</b> </label><br>
<input type="text" size="72" required>
<br><br><br>
<label for="tel"><b>Mobile No:</b></label>
<input type="tel" min="11" max="13" size="22" required>

<label for="email"><b>Email Id:</b></label>
<input type="email" size="22" required>
<br><br><br>
<label for="father name"><b>Father Name:</b> </label>
<input type="text" size="20" required>

<label for="tel"><b>Mobile No:</b> </label>
<input type="tel" size="20" required>
<br><br><br>
<label for="date"><b>Date of Birth:</b></label>
<input type="date" name="date" id="date" size="20">
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
<label for="select course"><b>Select Course</b></label>
<select name="Course" id="">
<option value="Select">select..</option>
<option value="html">HTML</option>
<option value="CSS">CSS</option>
<option value="javascripct">Javascripct</option>
<option value="pythone">Pythone</option>
<option value="java">Java</option>
</select>
<br><br><br>
<label for="gender"><b>Gender:</b></label>
<input type="radio" name="gender" value="Male">Male
<input type="radio" name="gender" value="Female">Female
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
<label for="select branch"><b>Select Branch:</b></label>
<input type="checkbox" name="select branch" id="CSE">CSE
<input type="checkbox" name="select branch" id="IT">IT
<input type="checkbox" name="select branch" id="ECE">ECE
<input type="checkbox" name="select branch" id="Civil">Civil
<br><br><br>
<label for="file"><b>Student Photo:</b></label>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
<input type="file">
<br><br><br>
<label for="address"><b>Address:</b></label><br>
<textarea name="address" id="address" placeholder="Inter Your address.."></textarea>
<br><br><br>
<button>Submit</button>
</form>
</body>
</html>
